[project]
name = "project-agentic-data-warehouse"
version = "0.0.0"
description = "Local data warehouse feeding NVIDIA Auto Ontology, with an agent harness"
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=26.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
