[project]
name = "project-agentic-data-warehouse"
version = "0.0.0"
description = "Local data warehouse feeding NVIDIA Auto Ontology, with an agent harness"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5,<1.6",
    "pyarrow>=26.0.1",
    "pyyaml>=6",
]

[dependency-groups]
dbt = [
    "dbt==2.0.12",
]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
