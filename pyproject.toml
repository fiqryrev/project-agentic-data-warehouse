[project]
name = "project-agentic-data-warehouse"
version = "0.1.0"
description = "Local data warehouse feeding NVIDIA Auto Ontology, with an agent harness"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5,<1.6",
    "pyarrow>=26.0.1,<27",
    "pyyaml>=6,<7",
]

[dependency-groups]
dbt = [
    "dbt==2.0.12",
]
dev = [
    # Renders the DAG's templates in tests with the engine Airflow uses (tests/pipeline).
    "jinja2>=3.1,<4",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
