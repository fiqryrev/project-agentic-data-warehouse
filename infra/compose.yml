# Local stack (PLAN section 6). Profiles: core (Airflow, M7), obs (gateway and Langfuse, M8);
# ontology arrives with M9. Every published port is bound to 127.0.0.1. Secrets come from the
# gitignored .env, which `make up-core` / `make up-obs` create. Start a profile with
# `make up-<profile>`, stop it with `make down-<profile>`.
name: wh

x-airflow: &airflow
  image: wh-airflow:3.3.2
  build:
    context: ..
    dockerfile: airflow/Dockerfile
  profiles: [core]
  restart: unless-stopped
  depends_on:
    airflow-db:
      condition: service_healthy
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_SECRET:?run make up-core, which writes it to .env}@airflow-db/airflow
    AIRFLOW__CORE__DAGS_FOLDER: /opt/wh/airflow/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    # Local only, bound to 127.0.0.1: every visitor of the UI is an admin, no password.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    # Shared by the api-server and the scheduler so task tokens verify; generated into .env.
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?run make up-core, which writes it to .env}
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
    WAREHOUSE_START_DATE: ${WAREHOUSE_START_DATE:-2026-01-01}
    GIT_SHA: ${GIT_SHA:-}
    DBT_DUCKDB_PATH: /opt/wh/data/build/dwh.duckdb
    DBT_TARGET_PATH: /tmp/dbt-target
    DBT_LOG_PATH: /tmp/dbt-logs
  volumes:
    - ..:/opt/wh
    - airflow-logs:/opt/airflow/logs

services:
  airflow-db:
    image: postgres:17.6-alpine
    profiles: [core]
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_SECRET:?run make up-core, which writes it to .env}
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 20

  airflow-init:
    <<: *airflow
    restart: "no"
    command: ["bash", "-c", "airflow db migrate"]

  airflow-apiserver:
    <<: *airflow
    command: ["api-server"]
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      retries: 30

  airflow-scheduler:
    <<: *airflow
    command: ["scheduler"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--local"]
      interval: 30s
      retries: 10

  airflow-dag-processor:
    <<: *airflow
    command: ["dag-processor"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # --- obs profile (M8): LiteLLM gateway and Langfuse v4; versions from docs/m0-findings.md ---
  obs-db:
    image: postgres:17.6-alpine
    profiles: [obs]
    restart: unless-stopped
    environment:
      POSTGRES_USER: obs
      POSTGRES_PASSWORD: ${OBS_DB_SECRET:?run make up-obs, which writes it to .env}
      POSTGRES_DB: obs
      TZ: UTC
      PGTZ: UTC
    volumes:
      - obs-db:/var/lib/postgresql/data
      - ./obs-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "obs"]
      interval: 5s
      retries: 20

  llm-gateway:
    # Environment (provider keys, master key, Langfuse keys) lives in llm-gateway/service.yml:
    # only infra/llm-gateway/ may name a provider's key variable (check_gateway_only).
    extends:
      file: llm-gateway/service.yml
      service: llm-gateway
    image: ghcr.io/berriai/litellm:v1.110.2@sha256:ef798594ca3db8d81bad2e1439f536f49b71fe095ee9f20416f5e149b4e22035
    profiles: [obs]
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      obs-db:
        condition: service_healthy
      langfuse-web:
        condition: service_started
    volumes:
      - ./llm-gateway/config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 10s
      retries: 30

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4.83.0@sha256:a6eac4bb99df27dd01a090e63d1a54660ba14044ae5e4c1ef1c883cec5d68ee4
    profiles: [obs]
    restart: unless-stopped
    depends_on: &langfuse-deps
      obs-db:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
    environment: &langfuse-env
      NEXTAUTH_URL: http://localhost:3001
      DATABASE_URL: postgresql://obs:${OBS_DB_SECRET}@obs-db:5432/langfuse
      SALT: ${LANGFUSE_SALT_SECRET:?run make up-obs, which writes it to .env}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_SECRET:?run make up-obs, which writes it to .env}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_SECRET:?run make up-obs, which writes it to .env}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_SECRET:?run make up-obs, which writes it to .env}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_SECRET}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${REDIS_SECRET:?run make up-obs, which writes it to .env}
      REDIS_TLS_ENABLED: "false"

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4.83.0@sha256:a91445265d1f5a13d666ef2f1491a437255fb9e5b7a76525d5543e4a4dc030f3
    profiles: [obs]
    restart: unless-stopped
    depends_on: *langfuse-deps
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?run make up-obs, which writes it to .env}
      # Headless init: org, project, API keys and the UI login are created on first start.
      LANGFUSE_INIT_ORG_ID: adw
      LANGFUSE_INIT_ORG_NAME: agentic-data-warehouse
      LANGFUSE_INIT_PROJECT_ID: adw-local
      LANGFUSE_INIT_PROJECT_NAME: adw-local
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-${LANGFUSE_PROJECT_PUBLIC_SECRET:?run make up-obs, which writes it to .env}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-${LANGFUSE_PROJECT_SECRET:?run make up-obs, which writes it to .env}
      LANGFUSE_INIT_USER_EMAIL: admin@example.com
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_ADMIN_SECRET:?run make up-obs, which writes it to .env}
    ports:
      - "127.0.0.1:3001:3000"

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:26.3.62.3@sha256:de3e47c64078aa196dae2349e048fc98ba81947f651f5c20e06e46baea8ae40a
    profiles: [obs]
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_SECRET}
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 20

  langfuse-minio:
    # Chainguard publishes no version tags; pinned by digest (M0).
    image: cgr.dev/chainguard/minio@sha256:e9cf6b99c226e9539ed0f14b6f00e37b07da153c7ba1f4f8709c807574b471ec
    profiles: [obs]
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET}
    volumes:
      - langfuse-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 15

  langfuse-redis:
    image: redis:7.4.7@sha256:976ab0f0939b78c06d802bcd3bea44c5142ea9a756a57b861e08819817f768c8
    profiles: [obs]
    restart: unless-stopped
    command: ["--requirepass", "${REDIS_SECRET}", "--maxmemory-policy", "noeviction"]
    volumes:
      - langfuse-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_SECRET}", "--no-auth-warning", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

volumes:
  airflow-db:
  airflow-logs:
  obs-db:
  langfuse-clickhouse-data:
  langfuse-clickhouse-logs:
  langfuse-minio-data:
  langfuse-redis-data:

networks:
  default:
    name: wh
