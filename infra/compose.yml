# Local stack (PLAN section 6). Profiles: core (Airflow, M7), obs (gateway and Langfuse, M8);
# ontology arrives with M9. Every published port is bound to 127.0.0.1. Secrets come from the
# gitignored .env, which `make up-core` / `make up-obs` create. Start a profile with
# `make up-<profile>`, stop it with `make down-<profile>`.
name: wh

x-airflow: &airflow
  image: wh-airflow:3.3.2
  build:
    context: ..
    dockerfile: airflow/Dockerfile
  profiles: [core]
  restart: unless-stopped
  depends_on:
    airflow-db:
      condition: service_healthy
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_SECRET:?run make up-core, which writes it to .env}@airflow-db/airflow
    AIRFLOW__CORE__DAGS_FOLDER: /opt/wh/airflow/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    # Local only, bound to 127.0.0.1: every visitor of the UI is an admin, no password.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    # Shared by the api-server and the scheduler so task tokens verify; generated into .env.
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?run make up-core, which writes it to .env}
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
    WAREHOUSE_START_DATE: ${WAREHOUSE_START_DATE:-2026-01-01}
    GIT_SHA: ${GIT_SHA:-}
    DBT_DUCKDB_PATH: /opt/wh/data/build/dwh.duckdb
    DBT_TARGET_PATH: /tmp/dbt-target
    DBT_LOG_PATH: /tmp/dbt-logs
    # refresh_ontology (task 6): restart through the socket proxy, compile on the ingestion service.
    DOCKER_PROXY_URL: http://docker-proxy:2375
    INGESTION_SERVICE_URL: http://ingestion-service:3002
    # golden_questions (task 7): Auto Ontology through its edge (Host and Origin stay
    # localhost:3000, the only origin its auth trusts), the gateway's spend log, Langfuse.
    AO_URL: http://ao-edge:3000
    GATEWAY_URL: http://llm-gateway:4000
    LANGFUSE_URL: http://langfuse-web:3000
  volumes:
    - ..:/opt/wh
    - airflow-logs:/opt/airflow/logs
  networks: [default, ontology]

services:
  airflow-db:
    image: postgres:17.6-alpine
    profiles: [core]
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_SECRET:?run make up-core, which writes it to .env}
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 20

  airflow-init:
    <<: *airflow
    restart: "no"
    command: ["bash", "-c", "airflow db migrate"]

  airflow-apiserver:
    <<: *airflow
    command: ["api-server"]
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      retries: 30

  airflow-scheduler:
    <<: *airflow
    command: ["scheduler"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--local"]
      interval: 30s
      retries: 10

  airflow-dag-processor:
    <<: *airflow
    command: ["dag-processor"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # --- obs profile (M8): LiteLLM gateway and Langfuse v4; versions from docs/m0-findings.md ---
  obs-db:
    image: postgres:17.6-alpine
    profiles: [obs]
    restart: unless-stopped
    environment:
      POSTGRES_USER: obs
      POSTGRES_PASSWORD: ${OBS_DB_SECRET:?run make up-obs, which writes it to .env}
      POSTGRES_DB: obs
      TZ: UTC
      PGTZ: UTC
    volumes:
      - obs-db:/var/lib/postgresql/data
      - ./obs-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "obs"]
      interval: 5s
      retries: 20

  llm-gateway:
    # Environment (provider keys, master key, Langfuse keys) lives in llm-gateway/service.yml:
    # only infra/llm-gateway/ may name a provider's key variable (check_gateway_only).
    extends:
      file: llm-gateway/service.yml
      service: llm-gateway
    image: ghcr.io/berriai/litellm:v1.110.2@sha256:ef798594ca3db8d81bad2e1439f536f49b71fe095ee9f20416f5e149b4e22035
    profiles: [obs]
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    networks: [default, ontology]
    depends_on:
      obs-db:
        condition: service_healthy
      langfuse-web:
        condition: service_started
    volumes:
      - ./llm-gateway/config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 10s
      retries: 30

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4.83.0@sha256:a6eac4bb99df27dd01a090e63d1a54660ba14044ae5e4c1ef1c883cec5d68ee4
    profiles: [obs]
    restart: unless-stopped
    depends_on: &langfuse-deps
      obs-db:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
    environment: &langfuse-env
      NEXTAUTH_URL: http://localhost:3001
      DATABASE_URL: postgresql://obs:${OBS_DB_SECRET}@obs-db:5432/langfuse
      SALT: ${LANGFUSE_SALT_SECRET:?run make up-obs, which writes it to .env}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_SECRET:?run make up-obs, which writes it to .env}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_SECRET:?run make up-obs, which writes it to .env}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_SECRET:?run make up-obs, which writes it to .env}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_SECRET}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${REDIS_SECRET:?run make up-obs, which writes it to .env}
      REDIS_TLS_ENABLED: "false"

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4.83.0@sha256:a91445265d1f5a13d666ef2f1491a437255fb9e5b7a76525d5543e4a4dc030f3
    profiles: [obs]
    restart: unless-stopped
    depends_on: *langfuse-deps
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?run make up-obs, which writes it to .env}
      # Headless init: org, project, API keys and the UI login are created on first start.
      LANGFUSE_INIT_ORG_ID: adw
      LANGFUSE_INIT_ORG_NAME: agentic-data-warehouse
      LANGFUSE_INIT_PROJECT_ID: adw-local
      LANGFUSE_INIT_PROJECT_NAME: adw-local
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-${LANGFUSE_PROJECT_PUBLIC_SECRET:?run make up-obs, which writes it to .env}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-${LANGFUSE_PROJECT_SECRET:?run make up-obs, which writes it to .env}
      LANGFUSE_INIT_USER_EMAIL: admin@example.com
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_ADMIN_SECRET:?run make up-obs, which writes it to .env}
    ports:
      - "127.0.0.1:3001:3000"

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:26.3.62.3@sha256:de3e47c64078aa196dae2349e048fc98ba81947f651f5c20e06e46baea8ae40a
    profiles: [obs]
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_SECRET}
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
      - ./langfuse/clickhouse-memory.xml:/etc/clickhouse-server/config.d/memory.xml:ro
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 20

  langfuse-minio:
    # Chainguard publishes no version tags; pinned by digest (M0).
    image: cgr.dev/chainguard/minio@sha256:e9cf6b99c226e9539ed0f14b6f00e37b07da153c7ba1f4f8709c807574b471ec
    profiles: [obs]
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET}
    volumes:
      - langfuse-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 15

  langfuse-redis:
    image: redis:7.4.7@sha256:976ab0f0939b78c06d802bcd3bea44c5142ea9a756a57b861e08819817f768c8
    profiles: [obs]
    restart: unless-stopped
    command: ["--requirepass", "${REDIS_SECRET}", "--maxmemory-policy", "noeviction"]
    volumes:
      - langfuse-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_SECRET}", "--no-auth-warning", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  # --- ontology profile (M9): NVIDIA Auto Ontology at infra/auto-ontology/UPSTREAM_SHA ---
  # Every Auto Ontology container is only on the internal network "ontology": no route out, so
  # the gateway is its one way to a model. ao-edge publishes the web UI (and its authenticated
# /api routes) to 127.0.0.1:3000; the backend's own port is never published.
  ao-db:
    image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    profiles: [ontology]
    restart: unless-stopped
    networks: [ontology]
    environment:
      POSTGRES_USER: ao
      POSTGRES_PASSWORD: ${AO_DB_SECRET:?run make up-ontology, which writes it to .env}
      POSTGRES_DB: auto_ontology
    volumes:
      - ao-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ao -d auto_ontology"]
      interval: 5s
      retries: 20

  auto-ontology-migrate:
    <<: &ao
      image: adw-auto-ontology:f3c310c7a279
      build:
        context: auto-ontology/upstream
      profiles: [ontology]
      networks: [ontology]
      environment: &ao-env
        POSTGRES_HOST: ao-db
        POSTGRES_PORT: "5432"
        POSTGRES_USER: ao
        POSTGRES_PASSWORD: ${AO_DB_SECRET}
        POSTGRES_DATABASE: auto_ontology
        # The published snapshot (publish_snapshot, DAG task 5), opened read-only.
        CONNECTION_STRINGS: duckdb:///data/serve/analytics.duckdb
        # Every model role goes to the gateway with the auto-ontology key (PLAN section 8.1).
        DEFAULT_MODELS_ENDPOINT: http://llm-gateway:4000/v1
        DEFAULT_MODELS_MODEL: openai/adw-non-reasoning
        DEFAULT_MODELS_API_KEY: ${GATEWAY_KEY_AUTO_ONTOLOGY:-}
        REASONING_ENDPOINT: http://llm-gateway:4000/v1
        REASONING_MODEL: openai/adw-reasoning
        REASONING_API_KEY: ${GATEWAY_KEY_AUTO_ONTOLOGY:-}
        NON_REASONING_ENDPOINT: http://llm-gateway:4000/v1
        NON_REASONING_MODEL: openai/adw-non-reasoning
        NON_REASONING_API_KEY: ${GATEWAY_KEY_AUTO_ONTOLOGY:-}
        EMBED_ENDPOINT: http://llm-gateway:4000/v1
        EMBED_MODEL: adw-embed
        EMBED_API_KEY: ${GATEWAY_KEY_AUTO_ONTOLOGY:-}
        # Rerank: native NVIDIA payload through the gateway's pass-through (URL ends in
        # /reranking). The route takes no key in LiteLLM OSS (M8); the key here is ignored.
        RERANK_ENDPOINT: http://llm-gateway:4000/nvidia/rerank-8b/reranking
        RERANK_MODEL: nvidia/nemotron-3.5-rerank-8b
        RERANK_API_KEY: ${GATEWAY_KEY_AUTO_ONTOLOGY:-}
        APP_URL: http://localhost:3000
        AUTO_ONTOLOGY_MCP_PUBLIC_URL: http://localhost:3003
        INGESTION_SERVICE_URL: http://ingestion-service:3002
        AUTO_ONTOLOGY_ADMIN_EMAIL: admin@example.com
        AUTO_ONTOLOGY_ADMIN_PASSWORD: ${AO_ADMIN_SECRET:?run make up-ontology, which writes it to .env}
        AUTH_SECRET: ${AO_AUTH_SECRET:?run make up-ontology, which writes it to .env}
    command: ["migrate"]
    restart: "no"
    depends_on:
      ao-db:
        condition: service_healthy

  frontend-migrate:
    <<: &ao-frontend
      image: adw-auto-ontology-frontend:f3c310c7a279
      build:
        context: auto-ontology/upstream/frontend
        args:
          PYTHON_API_URL: http://auto-ontology:3001
      profiles: [ontology]
      networks: [ontology]
      environment:
        <<: *ao-env
        PYTHON_API_URL: http://auto-ontology:3001
    # Creates frontend.configurations, which semantic compile reads (M0, item 3).
    working_dir: /app/migrate
    command: ["sh", "prisma/migrate.sh"]
    restart: "no"
    depends_on:
      ao-db:
        condition: service_healthy

  # Turns semantic compile on (opt-in upstream: a missing row means off). Runs once, after the
  # frontend migration has created frontend.configurations; leaves an existing value alone.
  ao-seed:
    image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    profiles: [ontology]
    networks: [ontology]
    restart: "no"
    environment:
      PGPASSWORD: ${AO_DB_SECRET}
    command:
      - psql
      - "--host=ao-db"
      - "--username=ao"
      - "--dbname=auto_ontology"
      - "--set=ON_ERROR_STOP=1"
      - "--command=insert into frontend.configurations (key, value, updated_at) values ('semantic_compilation_enabled', 'true', now()) on conflict (key) do nothing"
    depends_on:
      frontend-migrate:
        condition: service_completed_successfully

  ingestion-service:
    <<: *ao
    command: ["ingestion_service"]
    restart: unless-stopped
    volumes:
      - ../data/serve:/data/serve:ro      # the directory, not the file: a rename must be seen
    depends_on:
      auto-ontology-migrate:
        condition: service_completed_successfully
      ao-seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3002/health/live', timeout=3).status == 200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 15s

  auto-ontology:
    <<: *ao
    restart: unless-stopped
    volumes:
      - ../data/serve:/data/serve:ro
    depends_on:
      auto-ontology-migrate:
        condition: service_completed_successfully
      ingestion-service:
        condition: service_started

  auto-ontology-frontend:
    <<: *ao-frontend
    restart: unless-stopped
    depends_on:
      auto-ontology:
        condition: service_started
      frontend-migrate:
        condition: service_completed_successfully

  ao-edge:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    profiles: [ontology]
    restart: unless-stopped
    networks: [default, ontology]
    volumes:
      - ./auto-ontology/edge.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      auto-ontology-frontend:
        condition: service_started

  # Airflow's refresh_ontology may restart exactly two containers and nothing else (PLAN 6).
  docker-proxy:
    image: wollomatic/socket-proxy:1.13.1@sha256:3935b709275e4ec35d6ed5a5c4a1f0d01ed31eec5e7234efc3357ecd47689002
    profiles: [ontology]
    restart: unless-stopped
    networks: [default]
    user: "0:0"
    command:
      - "-loglevel=info"
      - "-listenip=0.0.0.0"
      - "-allowfrom=airflow-scheduler"
      - "-allowPOST=^/v[0-9.]+/containers/wh-(auto-ontology|ingestion-service)-1/restart$"
      - "-allowGET=^/_ping$"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  airflow-db:
  airflow-logs:
  obs-db:
  langfuse-clickhouse-data:
  langfuse-clickhouse-logs:
  langfuse-minio-data:
  langfuse-redis-data:
  ao-db:

networks:
  default:
    name: wh
  ontology:
    name: wh-ontology
    internal: true                # no route out; the gateway is the only way to a model
