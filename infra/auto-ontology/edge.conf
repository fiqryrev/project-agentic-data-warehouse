# The only door into the ontology network from the host: Auto Ontology's containers sit on an
# internal network with no route out (their one way to a model is the gateway), and Docker
# publishes no port of a container that is only on an internal network. This nginx is on both.
# Only the web UI is published: the backend API (3001) answers without authentication because
# it trusts the frontend, so scripts go through the frontend with a session or API token.
events {}
http {
  proxy_read_timeout 600s;          # chat answers stream for minutes
  proxy_buffering off;              # keep the stream flowing
  client_max_body_size 20m;
  server {
    listen 3000;                    # web UI
    location / {
      proxy_pass http://auto-ontology-frontend:3000;
      proxy_set_header Host $host;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
