name: codeql

# Static analysis of the Python code (S7, security review 2026-11-23). Results go to the
# repository's code scanning alerts; this job does not block a merge on its own.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"         # weekly, for queries that changed upstream

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: codeql (python)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read               # needed to upload results if the repository is ever private
      security-events: write      # upload the results; nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: python
          build-mode: none
          # The Auto Ontology clone is gitignored and never checked out; listed for clarity.
          config: |
            paths-ignore:
              - infra/auto-ontology/upstream

      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:python
