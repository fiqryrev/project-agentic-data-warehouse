name: codeql

# Static analysis of the Python code (S7, security review 2026-11-23). Results go to the
# repository's code scanning alerts; this job does not block a merge on its own.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"         # weekly, for queries that changed upstream

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: codeql (python)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write      # upload the results; nothing else
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: python
          build-mode: none
          # The Auto Ontology clone is gitignored and never checked out; listed for clarity.
          config: |
            paths-ignore:
              - infra/auto-ontology/upstream

      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:python
