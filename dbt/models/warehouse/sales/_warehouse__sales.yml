version: 2
models:
- name: dim__sales__customers
  description: 'Customers with history: one row per version (creation, then each move), valid_from to
    valid_to.'
  columns:
  - name: customer_version_key
    description: Key of the customer version (one row of dim__sales__customers).
    data_tests:
    - unique
    - not_null
  - name: customer_id
    description: Shop customer id; the ledger writes it as cust_ref C-0001234.
    data_tests:
    - not_null
  - name: full_name
    description: Customer name (fictional).
  - name: email
    description: Customer email (fictional, example.com).
  - name: city
    description: City, in title case.
  - name: province
    description: Province of the city.
  - name: created_at
    description: When the record was created in the source (UTC).
  - name: valid_from
    description: Start of the period this row is valid for.
  - name: valid_to
    description: End of the period this row is valid for; null while it is current.
  - name: is_current
    description: True for the version that is valid now.
  - name: _dbt_invocation_id
    description: dbt invocation that built this row.
  - name: _dbt_updated_at
    description: When dbt built this row (UTC).
  data_tests:
  - scd2_valid:
      arguments:
        key: customer_id
- name: dim__sales__products
  description: 'Products with price history: one row per price version, valid_from to valid_to.'
  columns:
  - name: product_version_key
    description: Key of the product version valid on the order day; null for orphan product keys.
    data_tests:
    - unique
    - not_null
  - name: product_id
    description: Shop product id; ids from 9,000,000 are orphan keys with no product.
  - name: product_name
    description: Product name.
  - name: seller_id
    description: Shop seller id; the ledger writes it as seller_ref S-00007.
    data_tests:
    - relationships:
        arguments:
          to: ref('dim__sales__sellers')
          field: seller_id
  - name: category_id
    description: Shop category id.
  - name: category_name
    description: Category name (Indonesian).
    data_tests:
    - not_null
  - name: parent_name
    description: Top-level category group.
  - name: price_idr
    description: List price in rupiah, PPN included.
  - name: created_at
    description: When the record was created in the source (UTC).
  - name: valid_from
    description: Start of the period this row is valid for.
  - name: valid_to
    description: End of the period this row is valid for; null while it is current.
  - name: is_current
    description: True for the version that is valid now.
  - name: _dbt_invocation_id
    description: dbt invocation that built this row.
  - name: _dbt_updated_at
    description: When dbt built this row (UTC).
  data_tests:
  - scd2_valid:
      arguments:
        key: product_id
- name: dim__sales__sellers
  description: Sellers.
  columns:
  - name: seller_id
    description: Shop seller id; the ledger writes it as seller_ref S-00007.
    data_tests:
    - unique
    - not_null
  - name: seller_name
    description: Seller shop name.
  - name: city
    description: City, in title case.
  - name: province
    description: Province of the city.
  - name: created_at
    description: When the record was created in the source (UTC).
  - name: _dbt_invocation_id
    description: dbt invocation that built this row.
  - name: _dbt_updated_at
    description: When dbt built this row (UTC).
- name: dim__sales__categories
  description: Product categories.
  columns:
  - name: category_id
    description: Shop category id.
    data_tests:
    - unique
    - not_null
  - name: category_name
    description: Category name (Indonesian).
  - name: parent_name
    description: Top-level category group.
  - name: _dbt_invocation_id
    description: dbt invocation that built this row.
  - name: _dbt_updated_at
    description: When dbt built this row (UTC).
- name: fact__sales__orders
  description: Orders, current state (latest row per order).
  columns:
  - name: order_id
    description: 'Shop order id: <day index of creation> * 100000 + n; the ledger writes ORD-<id>.'
    data_tests:
    - unique
    - not_null
  - name: customer_id
    description: Shop customer id; the ledger writes it as cust_ref C-0001234.
  - name: order_status
    description: 'Order status: placed, paid, in_transit, delivered or cancelled (shipped before 2026-06-01
      is renamed in_transit).'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - placed
          - paid
          - in_transit
          - delivered
          - cancelled
  - name: voucher_code
    description: Voucher code used on the order, if any.
  - name: shipping_fee_idr
    description: Shipping fee charged to the customer, in rupiah.
  - name: created_at
    description: When the record was created in the source (UTC).
  - name: order_date
    description: Day the order was created.
  - name: updated_at
    description: When the source wrote this version of the record (UTC).
  - name: _dbt_invocation_id
    description: dbt invocation that built this row.
  - name: _dbt_updated_at
    description: When dbt built this row (UTC).
- name: fact__sales__order_items
  description: Order lines with the product and customer versions valid on the order day.
  columns:
  - name: order_item_id
    description: 'Order line id: order_id * 10 + line number.'
    data_tests:
    - unique
    - not_null
  - name: order_id
    description: 'Shop order id: <day index of creation> * 100000 + n; the ledger writes ORD-<id>.'
    data_tests:
    - relationships:
        arguments:
          to: ref('fact__sales__orders')
          field: order_id
        config:
          severity: warn
        description: 'Warns, not fails: an order row held back as a late row may not have arrived yet
          at the edge of the loaded dates.'
  - name: order_date
    description: Day the order was created.
  - name: product_id
    description: Shop product id; ids from 9,000,000 are orphan keys with no product.
  - name: product_version_key
    description: Key of the product version valid on the order day; null for orphan product keys.
    data_tests:
    - not_null:
        config:
          severity: warn
  - name: customer_id
    description: Shop customer id; the ledger writes it as cust_ref C-0001234.
  - name: customer_version_key
    description: Key of the customer version (one row of dim__sales__customers).
    data_tests:
    - not_null:
        config:
          severity: warn
        description: 'Warns: null while the order row is still a late row in transit.'
  - name: quantity
    description: Units on the line.
  - name: unit_price_idr
    description: Price per unit on the order day, in rupiah.
  - name: line_amount_idr
    description: Line amount (quantity * unit price), before voucher and shipping, in rupiah.
  - name: _dbt_invocation_id
    description: dbt invocation that built this row.
  - name: _dbt_updated_at
    description: When dbt built this row (UTC).
- name: fact__sales__payments
  description: Payments.
  columns:
  - name: payment_id
    description: Payment id (equals the order id).
    data_tests:
    - unique
    - not_null
  - name: order_id
    description: 'Shop order id: <day index of creation> * 100000 + n; the ledger writes ORD-<id>.'
    data_tests:
    - relationships:
        arguments:
          to: ref('fact__sales__orders')
          field: order_id
        config:
          severity: warn
        description: 'Warns, not fails: an order row held back as a late row may not have arrived yet
          at the edge of the loaded dates.'
  - name: payment_method
    description: Payment method.
  - name: amount_idr
    description: Amount in rupiah.
  - name: paid_at
    description: When the payment was received (UTC).
  - name: paid_date
    description: Day of the payment.
  - name: _dbt_invocation_id
    description: dbt invocation that built this row.
  - name: _dbt_updated_at
    description: When dbt built this row (UTC).
- name: fact__sales__shipments
  description: Shipments, current state.
  columns:
  - name: shipment_id
    description: Shipment id (equals the order id).
    data_tests:
    - unique
    - not_null
  - name: order_id
    description: 'Shop order id: <day index of creation> * 100000 + n; the ledger writes ORD-<id>.'
  - name: courier
    description: Courier.
  - name: shipment_status
    description: 'Shipment status: in_transit or delivered.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - in_transit
          - delivered
  - name: shipped_at
    description: When the parcel was handed to the courier (UTC).
  - name: delivered_at
    description: When the parcel was delivered (UTC); null until then.
  - name: _dbt_invocation_id
    description: dbt invocation that built this row.
  - name: _dbt_updated_at
    description: When dbt built this row (UTC).
- name: fact__sales__refunds
  description: Refunds.
  columns:
  - name: refund_id
    description: Refund id (equals the order id).
    data_tests:
    - unique
    - not_null
  - name: order_id
    description: 'Shop order id: <day index of creation> * 100000 + n; the ledger writes ORD-<id>.'
  - name: refund_reason
    description: Reason given for the refund.
  - name: amount_idr
    description: Amount in rupiah.
  - name: refunded_at
    description: When the refund was made (UTC).
  - name: refund_date
    description: Day of the refund.
  - name: _dbt_invocation_id
    description: dbt invocation that built this row.
  - name: _dbt_updated_at
    description: When dbt built this row (UTC).
