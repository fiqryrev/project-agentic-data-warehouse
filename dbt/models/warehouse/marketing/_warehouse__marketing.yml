version: 2
models:
- name: dim__marketing__campaigns
  description: Marketing campaigns.
  columns:
  - name: campaign_id
    description: 'Campaign id: <yyyymm> * 10 + n.'
    data_tests:
    - unique
    - not_null
  - name: campaign_name
    description: Campaign name.
  - name: channel
    description: 'Marketing channel: google, meta, tiktok or email.'
  - name: start_date
    description: First day of the campaign.
  - name: end_date
    description: Last day of the campaign.
  - name: budget_idr
    description: Campaign budget in rupiah.
  - name: _dbt_invocation_id
    description: dbt invocation that built this row.
  - name: _dbt_updated_at
    description: When dbt built this row (UTC).
- name: fact__marketing__daily_spend
  description: Spend per campaign and day.
  columns:
  - name: spend_date
    description: Day of the spend.
  - name: campaign_id
    description: 'Campaign id: <yyyymm> * 10 + n.'
    data_tests:
    - relationships:
        arguments:
          to: ref('dim__marketing__campaigns')
          field: campaign_id
  - name: channel
    description: 'Marketing channel: google, meta, tiktok or email.'
  - name: spend_idr
    description: Spend that day in rupiah.
  - name: impressions
    description: Ad impressions that day.
  - name: clicks
    description: Ad clicks that day.
  - name: _dbt_invocation_id
    description: dbt invocation that built this row.
  - name: _dbt_updated_at
    description: When dbt built this row (UTC).
  data_tests:
  - unique_combination:
      arguments:
        columns:
        - spend_date
        - campaign_id
