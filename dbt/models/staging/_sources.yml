version: 2

sources:
  - name: lake
    description: Landing partitions loaded by loader/ (append-only by _dt, audit columns).
    schema: lake
    tables:
      - name: shop__categories
        description: Shop category list, written in full every day.
      - name: shop__customers
        description: Shop customers, written when created and again when they move.
      - name: shop__sellers
        description: Shop sellers, written when created.
      - name: shop__products
        description: Shop products, written when created and again on each price change.
      - name: shop__vouchers
        description: Monthly voucher catalog, written on the first day of each month.
      - name: shop__orders
        description: Order states, one row per order on each day it had an event.
      - name: shop__order_items
        description: Order lines, written on the order's creation day.
      - name: shop__payments
        description: Payments, written on the payment day.
      - name: shop__shipments
        description: Shipment states, written when shipped and when delivered.
      - name: shop__refunds
        description: Refunds, written on the refund day.
      - name: ledger__invoices
        description: Ledger invoice postings, on the payment day and again on a refund.
      - name: ledger__invoice_lines
        description: Ledger invoice lines, written on the payment day.
      - name: ledger__settlements
        description: Daily seller settlements from the ledger.
      - name: marketing__campaigns
        description: Monthly campaign catalog.
      - name: marketing__daily_spend
        description: Spend per campaign and day.
