version: 2
models:
- name: staging__ledger__invoices
  description: Ledger invoice postings with the shop's numeric order and customer ids.
  columns:
  - name: invoice_id
    description: Ledger invoice id, INV-<order id>.
  - name: order_id
    description: 'Shop order id: <day index of creation> * 100000 + n; the ledger writes ORD-<id>.'
    data_tests:
    - not_null
  - name: customer_id
    description: Shop customer id; the ledger writes it as cust_ref C-0001234.
  - name: invoice_date
    description: Date the invoice was raised (payment date).
  - name: invoice_status
    description: 'Ledger status: PAID, PARTIAL_REFUND or REFUNDED.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - PAID
          - PARTIAL_REFUND
          - REFUNDED
  - name: gross_idr
    description: 'Invoice total in rupiah: items minus voucher plus shipping, PPN included.'
  - name: tax_idr
    description: PPN (11%) inside the gross amount, in rupiah.
  - name: refund_idr
    description: Refunded amount in rupiah.
  - name: net_revenue_idr
    description: 'Revenue net of refunds and PPN: (gross - refund) / 1.11, in rupiah.'
  - name: posted_at
    description: When the ledger posted this version of the invoice (UTC).
  - name: _dt
    description: Lake partition date the row arrived in.
  data_tests:
  - unique_combination:
      arguments:
        columns:
        - invoice_id
        - posted_at
- name: staging__ledger__invoice_lines
  description: Ledger invoice lines.
  columns:
  - name: invoice_id
    description: Ledger invoice id, INV-<order id>.
  - name: line_no
    description: Line number on the invoice.
  - name: product_id
    description: Shop product id; ids from 9,000,000 are orphan keys with no product.
  - name: quantity
    description: Units on the line.
  - name: line_amount_idr
    description: quantity * unit price, in rupiah.
  - name: _dt
    description: Lake partition date the row arrived in.
  data_tests:
  - unique_combination:
      arguments:
        columns:
        - invoice_id
        - line_no
- name: staging__ledger__settlements
  description: Daily seller settlements with the shop's numeric seller id.
  columns:
  - name: settlement_id
    description: Ledger settlement id, STL-<yyyymmdd>-<seller id>.
    data_tests:
    - unique
    - not_null
  - name: seller_id
    description: Shop seller id; the ledger writes it as seller_ref S-00007.
  - name: settlement_date
    description: Settlement day.
  - name: gross_sales_idr
    description: Seller sales settled that day, in rupiah.
  - name: commission_idr
    description: Marketplace commission (5%), in rupiah.
  - name: payout_idr
    description: Amount paid out to the seller, in rupiah.
  - name: _dt
    description: Lake partition date the row arrived in.
