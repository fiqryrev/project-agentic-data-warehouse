version: 2
models:
- name: rpt__finance__revenue__daily
  description: '{{ doc("rpt__finance__revenue__daily") }}'
  columns:
  - name: revenue_date
    description: 'Day: payment date for the shop, invoice date for the ledger.'
    data_tests:
    - unique
    - not_null
  - name: invoice_count
    description: Invoices raised that day.
  - name: shop_paid_idr
    description: Money the shop received that day, in rupiah.
  - name: ledger_gross_idr
    description: Ledger gross on invoices raised that day, in rupiah.
  - name: ledger_refund_idr
    description: Refunds on invoices raised that day (current state), in rupiah.
  - name: ledger_tax_idr
    description: PPN on invoices raised that day, in rupiah.
  - name: net_revenue_idr
    description: 'Revenue net of refunds and PPN: (gross - refund) / 1.11, in rupiah.'
  - name: _dbt_invocation_id
    description: dbt invocation that built this row.
  - name: _dbt_updated_at
    description: When dbt built this row (UTC).
