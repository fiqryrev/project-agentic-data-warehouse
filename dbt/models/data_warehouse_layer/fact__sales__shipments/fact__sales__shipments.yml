version: 2
models:
- name: fact__sales__shipments
  description: '{{ doc("fact__sales__shipments") }}'
  columns:
  - name: shipment_id
    description: Shipment id (equals the order id).
    data_tests:
    - unique
    - not_null
  - name: order_id
    description: 'Shop order id: <day index of creation> * 100000 + n; the ledger writes ORD-<id>.'
  - name: courier_name
    description: Courier.
  - name: shipment_status
    description: 'Shipment status: in_transit or delivered.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - in_transit
          - delivered
  - name: shipped_at
    description: When the parcel was handed to the courier (UTC).
  - name: delivered_at
    description: When the parcel was delivered (UTC); null until then.
  - name: _dbt_invocation_id
    description: dbt invocation that built this row.
  - name: _dbt_updated_at
    description: When dbt built this row (UTC).
