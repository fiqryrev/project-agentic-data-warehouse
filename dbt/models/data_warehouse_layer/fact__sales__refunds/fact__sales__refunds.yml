version: 2
models:
- name: fact__sales__refunds
  description: '{{ doc("fact__sales__refunds") }}'
  columns:
  - name: refund_id
    description: Refund id (equals the order id).
    data_tests:
    - unique
    - not_null
  - name: order_id
    description: 'Shop order id: <day index of creation> * 100000 + n; the ledger writes ORD-<id>.'
  - name: refund_reason_code
    description: Reason given for the refund.
  - name: amount_idr
    description: Amount in rupiah.
  - name: refunded_at
    description: When the refund was made (UTC).
  - name: refund_date
    description: Day of the refund.
  - name: _dbt_invocation_id
    description: dbt invocation that built this row.
  - name: _dbt_updated_at
    description: When dbt built this row (UTC).
